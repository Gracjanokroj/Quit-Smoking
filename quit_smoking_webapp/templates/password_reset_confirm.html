<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Set new password</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(800px 450px at 15% 10%, rgba(55,210,130,.10), transparent 60%),
        radial-gradient(700px 450px at 90% 15%, rgba(95,140,255,.10), transparent 60%),
        #070a10;
      color: #e8eefb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #0d1220;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 22px;
    }

    form p { margin-bottom: 14px; }

    input {
      width: 95%;
      padding: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: white;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #32c978;
      font-weight: bold;
      cursor: pointer;
    }

    a { color: #e8eefb; font-size: 13px; }
  </style>
</head>

<body>
  <div class="card">
    <h1>Set new password</h1>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Save password</button>
    </form>

    <p><a href="{% url 'login' %}">Back to login</a></p>
  </div>
</body>
</html>
