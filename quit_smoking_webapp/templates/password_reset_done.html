<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Password reset sent</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(800px 450px at 15% 10%, rgba(55,210,130,.10), transparent 60%),
        radial-gradient(700px 450px at 90% 15%, rgba(95,140,255,.10), transparent 60%),
        #070a10;
      color: #e8eefb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      background: #0d1220;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      max-width: 420px;
      text-align: center;
    }

    a {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 14px;
      background: #32c978;
      color: black;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Check your email</h1>
    <p>If the address exists, a reset link has been sent.</p>
    <a href="{% url 'login' %}">Back to login</a>
  </div>
</body>
</html>
